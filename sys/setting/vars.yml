# 系统级变量定义（system 段，仅非密钥配置）—— 产品默认值
#
# 现场值不要写在这里：写 ops-prj 的 `values/<系统名>/sys_value.yml`。
# 链路：本文件 -> `gops sys update` -> sys/merged_vars.yml
#       -> `gops sys localize`（+ values/ 覆盖）-> 栈根 .env
#
# 容器内端口/路径/服务名是应用契约，直接写在 sys/docker-compose.yml 里。
system:
  # 后端与前端镜像来自同一个 registry，但 tag 各自独立（两个仓独立发版）。
  - name: ATLAS_REGISTRY
    value: ghcr.io/dayu-sec

  - name: ATLAS_IMAGE_TAG
    value: v0.2.0
  - name: ATLAS_WEB_IMAGE_TAG
    value: v0.1.0

  - name: PG_REGISTRY
    value: docker.io/library
  - name: PG_IMAGE_TAG
    value: '16'

  # 宿主端口。web 是唯一给浏览器用的入口；atlas 端口只用于调试，默认绑回环。
  - name: WEB_BIND_IP
    value: 127.0.0.1
  - name: WEB_HOST_PORT
    value: 8080

  - name: ATLAS_BIND_IP
    value: 127.0.0.1
  - name: ATLAS_HOST_PORT
    value: 8081

  - name: PG_BIND_IP
    value: 127.0.0.1
  - name: PG_HOST_PORT
    value: 55433

  # 存储。默认口令只用于本地；现场通过 values/ 或 ${SEC_*} 覆盖。
  - name: PG_DB
    value: wist_atlas
  - name: PG_USER
    value: atlas
  - name: PG_PASSWORD
    value: atlas

  - name: TZ
    value: Asia/Shanghai
